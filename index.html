<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robohero vs Zombies — GREENJIM STUDIOS</title>
  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0d0d0d;
      color: #00ff66;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    header {
      margin-bottom: 1rem;
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: 1.8rem;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
    }
    p {
      margin: 0.25rem 0 0;
      color: #888;
      font-size: 0.9rem;
    }
    #player-container {
      width: 960px;
      height: 600px;
      max-width: 95vw;
      max-height: 75vh;
      border: 2px solid #00ff6633;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 255, 102, 0.15);
      overflow: hidden;
      background: #000;
    }
    ruffle-player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>ROBOHERO VS ZOMBIES</h1>
    <p>GREENJIM STUDIOS • Built in Flash & ActionScript • Emulated via Ruffle (WASM)</p>
  </header>
  <div id="player-container">
    <ruffle-player id="player"></ruffle-player>
  </div>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      const container = document.getElementById("player-container");
      container.innerHTML = "";
      container.appendChild(player);
      player.load("rvz.swf");
    });
  </script>
</body>
</html>
